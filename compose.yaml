services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qlts}
      POSTGRES_USER: ${POSTGRES_USER:-qlts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qlts_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qlts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlts} -d ${POSTGRES_DB:-qlts}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qlts_postgres_data:
